[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readmemory"
version = "0.1.5"
description = "A verified memory layer for English reading notes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ReadMemory"}]

[project.optional-dependencies]
epub = ["ebooklib>=0.18"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
readmemory = "readmemory.cli:main"
readmemory-mcp = "readmemory.mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
